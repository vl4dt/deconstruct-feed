<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="80" height="80" rx="8" fill="url(#bgGradient)"/>
  
  <!-- Newspaper/Article Icon -->
  <g transform="translate(20, 20)">
    <!-- Main document shape -->
    <rect x="0" y="0" width="40" height="40" rx="3" fill="url(#iconGradient)" opacity="0.2"/>
    
    <!-- Header lines (title) -->
    <rect x="6" y="6" width="28" height="3" rx="1.5" fill="url(#iconGradient)" opacity="0.8"/>
    <rect x="6" y="11" width="20" height="2" rx="1" fill="url(#iconGradient)" opacity="0.6"/>
    
    <!-- Content lines -->
    <rect x="6" y="18" width="28" height="1.5" rx="0.75" fill="url(#iconGradient)" opacity="0.5"/>
    <rect x="6" y="22" width="28" height="1.5" rx="0.75" fill="url(#iconGradient)" opacity="0.5"/>
    <rect x="6" y="26" width="22" height="1.5" rx="0.75" fill="url(#iconGradient)" opacity="0.5"/>
    
    <!-- Image placeholder box -->
    <rect x="6" y="30" width="12" height="8" rx="1.5" fill="url(#iconGradient)" opacity="0.4"/>
    
    <!-- Additional content lines -->
    <rect x="20" y="31" width="14" height="1.5" rx="0.75" fill="url(#iconGradient)" opacity="0.5"/>
    <rect x="20" y="35" width="14" height="1.5" rx="0.75" fill="url(#iconGradient)" opacity="0.5"/>
  </g>
</svg>
