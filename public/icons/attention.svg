<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FD1C5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#319795;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" />
  
  <!-- Lens/Shutter Design -->
  <g transform="translate(64, 64)">
    <circle cx="0" cy="0" r="35" fill="white" opacity="0.2" />
    <circle cx="0" cy="0" r="25" fill="white" />
    <circle cx="0" cy="0" r="15" fill="#319795" />
  </g>
  
  <!-- Notification Dot -->
  <circle cx="100" cy="28" r="20" fill="#E53E3E" stroke="white" stroke-width="4" />
  <text x="100" y="36" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">!</text>
</svg>
